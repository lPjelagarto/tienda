<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar">
    <a th:href="@{/}">Inicio</a>
    <span sec:authorize="hasRole('CLIENTE')"> | <a th:href="@{/cliente}">Cliente</a></span>
    <span sec:authorize="hasRole('VENDEDOR')"> | <a th:href="@{/vendedor}">Vendedor</a></span>
    <span sec:authorize="hasRole('ADMIN')">
        | <a th:href="@{/cliente}">Cliente</a>
        | <a th:href="@{/vendedor}">Vendedor</a>
        | <a th:href="@{/admin}">Admin</a>
    </span>
    <span sec:authorize="isAnonymous()"> | <a th:href="@{/login}">Iniciar sesión</a></span>
    <span sec:authorize="isAuthenticated()">
        | Usuario: <span sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Cerrar sesión</button>
        </form>
    </span>
</nav>
</body>
</html>
